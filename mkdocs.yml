site_name: Cece Docs
site_url: https://genesi0s.github.io/cece/
site_description: Documentation du projet cece
site_author: Cedric

repo_name: Genesi0s/cece
repo_url: https://github.com/Genesi0s/cece

docs_dir: docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Accueil: index.md
  - Metrics:
      - Présentation: metrics/index.md
      - Backend: metrics/backend.md
      - Frontend: metrics/frontend.md
  - Infrastructure:
      - Ansible: infra/ansible.md
      - Monitoring: infra/monitoring.md
